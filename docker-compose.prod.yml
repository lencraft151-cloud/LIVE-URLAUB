# Produktiv-Override: echte Domain + automatisches HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Voraussetzungen:
#   - DOMAIN in der .env gesetzt (z.B. stream.example.com)
#   - Ein A-Record dieser Domain zeigt auf die IP des Servers
#   - Die Ports 80 und 443 sind aus dem Internet erreichbar (Let's Encrypt prueft darueber)
services:
  web:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Eine Domain statt ":80" aktiviert in Caddy automatisch Let's Encrypt.
      SITE_ADDRESS: ${DOMAIN:?DOMAIN muss in der .env gesetzt sein, z.B. stream.example.com}
    volumes:
      # Zertifikate ueberleben so einen Neustart - sonst drohen Rate-Limits bei Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
